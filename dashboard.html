<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Node 2 Edge Navigation</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #19222b;
      --border: #2a3744;
      --text: #eef3f8;
      --muted: #8ea0b2;
      --accent: #00e5ff;
      --green: #00e676;
      --orange: #ff7043;
      --red: #ff5252;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding: 12px; gap: 10px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    .title { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #263238; color: var(--muted); }
    .badge.online { background: rgba(0, 230, 118, 0.16); color: var(--green); }
    .badge.blocked { background: rgba(255, 82, 82, 0.18); color: var(--red); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; text-align: center; }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val { font-size: 15px; font-weight: 700; margin-top: 2px; color: var(--accent); }
    .map-wrap { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { width: 100%; max-width: 560px; aspect-ratio: 1 / 1; background: #14191e; border-radius: 10px; touch-action: manipulation; cursor: crosshair; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
    .controls { display: flex; gap: 8px; }
    button { flex: 1; background: #1f2d3a; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button.primary { background: #006b7d; border-color: var(--accent); }
    button:active { transform: scale(0.98); }
    .toast { font-size: 12px; text-align: center; min-height: 18px; color: var(--green); }
    @media (max-width: 500px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">CARLA Edge Node 2</div>
      <div id="mapLabel" style="font-size:11px;color:#8ea0b2;">Waiting for Node 1...</div>
    </div>
    <span id="stateBadge" class="badge">WAITING</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Maneuver</div><div id="maneuverVal" class="stat-val">—</div></div>
    <div class="stat"><div class="stat-label">Speed</div><div id="speedVal" class="stat-val">0 km/h</div></div>
    <div class="stat"><div class="stat-label">Remaining</div><div id="remVal" class="stat-val">0 m</div></div>
    <div class="stat"><div class="stat-label">Progress</div><div id="progVal" class="stat-val">0%</div></div>
  </div>

  <div class="map-wrap">
    <canvas id="mapCanvas" width="560" height="560"></canvas>
    <div class="hint">Tap anywhere on the map to set a new destination (snaps to nearest road)</div>
  </div>

  <div class="controls">
    <button class="primary" onclick="pickRandomDestination()">Random Road Destination</button>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d");

    let loadedMap = null;
    let mapBounds = null;
    let mapRoads = [];
    let latestState = null;

    function getTransform() {
      if (!mapBounds) return null;
      const pad = 24;
      const minX = mapBounds.min_x, maxX = mapBounds.max_x;
      const minY = mapBounds.min_y, maxY = mapBounds.max_y;
      const spanX = Math.max(1e-3, maxX - minX);
      const spanY = Math.max(1e-3, maxY - minY);
      const scale = Math.min((canvas.width - 2 * pad) / spanX, (canvas.height - 2 * pad) / spanY);
      const offX = (canvas.width - spanX * scale) / 2;
      const offY = (canvas.height - spanY * scale) / 2;
      return { minX, maxY, scale, offX, offY };
    }

    function worldToPx(wx, wy, t) {
      return [
        t.offX + (wx - t.minX) * t.scale,
        t.offY + (t.maxY - wy) * t.scale
      ];
    }

    function pxToWorld(px, py, t) {
      return [
        t.minX + (px - t.offX) / t.scale,
        t.maxY - (py - t.offY) / t.scale
      ];
    }

    async function loadMapRoads(mapName) {
      try {
        const res = await fetch(`/map_roads/${encodeURIComponent(mapName)}`);
        if (!res.ok) return;
        const data = await res.json();
        loadedMap = mapName;
        mapBounds = data.bounds;
        mapRoads = data.roads || [];
      } catch (e) {}
    }

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = getTransform();
      if (!t) {
        ctx.fillStyle = "#8ea0b2";
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Start Node 1 (live_demo.py) to view live map", canvas.width / 2, canvas.height / 2);
        return;
      }

      // Draw roads
      ctx.strokeStyle = "#5a6875";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (const seg of mapRoads) {
        if (!seg || seg.length < 2) continue;
        const [x1, y1] = worldToPx(seg[0][0], seg[0][1], t);
        const [x2, y2] = worldToPx(seg[1][0], seg[1][1], t);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
      }
      ctx.stroke();

      if (!latestState || !latestState.active) return;

      // Draw planned route
      const poly = latestState.polyline_2d || [];
      if (poly.length >= 2) {
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        poly.forEach((pt, idx) => {
          const [px, py] = worldToPx(pt[0], pt[1], t);
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.stroke();
      }

      // Draw Destination marker
      if (latestState.destination) {
        const [dx, dy] = worldToPx(latestState.destination[0], latestState.destination[1], t);
        ctx.fillStyle = "#ff7043";
        ctx.beginPath();
        ctx.arc(dx, dy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Draw Vehicle arrow
      const [vx, vy] = worldToPx(latestState.x, latestState.y, t);
      const yawRad = -(latestState.heading_yaw_deg || 0) * Math.PI / 180.0;
      ctx.save();
      ctx.translate(vx, vy);
      ctx.rotate(yawRad);
      ctx.fillStyle = "#00e676";
      ctx.beginPath();
      ctx.moveTo(11, 0);
      ctx.lineTo(-7, -6);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-7, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    async function sendDestination(destCoords, isRandom = false) {
      const toast = document.getElementById("toast");
      if (!latestState || !latestState.active) {
        toast.textContent = "Wait for Node 1 to start a route first.";
        return;
      }
      toast.textContent = isRandom ? "Picking random road..." : "Snapping to nearest road & rerouting...";
      try {
        const body = isRandom
          ? { route_id: latestState.route_id, random_dest: true }
          : { route_id: latestState.route_id, destination: destCoords };
        const res = await fetch("/set_destination", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
          toast.textContent = `Rerouted: ${data.total_distance_m} m to road (${data.destination[0].toFixed(1)}, ${data.destination[1].toFixed(1)})`;
        } else {
          toast.textContent = data.detail || "Could not reroute.";
        }
      } catch (e) {
        toast.textContent = "Connection error.";
      }
    }

    function pickRandomDestination() {
      sendDestination(null, true);
    }

    canvas.addEventListener("click", (ev) => {
      const t = getTransform();
      if (!t) return;
      const rect = canvas.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * (canvas.width / rect.width);
      const py = (ev.clientY - rect.top) * (canvas.height / rect.height);
      const [wx, wy] = pxToWorld(px, py, t);
      sendDestination([wx, wy], false);
    });

    async function poll() {
      try {
        const res = await fetch("/telemetry/latest");
        const data = await res.json();
        latestState = data;

        const badge = document.getElementById("stateBadge");
        if (!data.active) {
          badge.textContent = "WAITING";
          badge.className = "badge";
          document.getElementById("mapLabel").textContent = "Waiting for Node 1...";
        } else {
          if (data.map_name && data.map_name !== loadedMap) {
            await loadMapRoads(data.map_name);
          }
          document.getElementById("mapLabel").textContent = `${data.map_name} • Route ${data.route_id}`;
          badge.textContent = data.nav_state;
          badge.className = data.nav_state === "BLOCKED" ? "badge blocked" : "badge online";
          document.getElementById("maneuverVal").textContent = data.maneuver || "—";
          document.getElementById("speedVal").textContent = `${(data.speed_kmh || 0).toFixed(1)} km/h`;
          document.getElementById("remVal").textContent = `${(data.remaining_distance_m || 0).toFixed(0)} m`;
          document.getElementById("progVal").textContent = `${(data.route_progress_pct || 0).toFixed(0)}%`;
        }
        drawMap();
      } catch (e) {}
    }

    setInterval(poll, 200);
    poll();
  </script>
</body>
</html>
